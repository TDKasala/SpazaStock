<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>SpazaStock</title>
    <meta name="description" content="Mobile-first PWA inventory and sales management tool for spaza shops with English and isiZulu support." />
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="theme-color" content="#09090b" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SpazaStock" />
    
    <!-- Icons (the manifest link is injected by vite-plugin-pwa) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" sizes="any" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="SpazaStock" />
    <meta property="og:description" content="Mobile-first PWA inventory and sales management tool for spaza shops with English and isiZulu support." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SpazaStock" />
    <meta name="twitter:description" content="Mobile-first PWA inventory and sales management tool for spaza shops with English and isiZulu support." />
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
